apiVersion: v1
kind: ServiceAccount
metadata:
  name: taskpulse-backend
  labels:
    app: taskpulse-backend
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskpulse-backend
  labels:
    app: taskpulse-backend
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: taskpulse-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: taskpulse-backend
    spec:
      automountServiceAccountToken: false
      serviceAccountName: taskpulse-backend
      terminationGracePeriodSeconds: 40
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: taskpulse-backend
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: flask-backend
          image: 400790842570.dkr.ecr.ap-south-1.amazonaws.com/taskpulse-backend:v2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: taskpulse-db
                  key: DB_HOST
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: taskpulse-db
                  key: DB_NAME
            - name: DB_USER
              value: taskpulse_app
            - name: DB_AUTH_MODE
              value: iam
            - name: DB_SSLMODE
              value: verify-full
            - name: AWS_REGION
              value: ap-south-1
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  labels:
    app: taskpulse-backend
spec:
  type: ClusterIP
  selector:
    app: taskpulse-backend
  ports:
    - name: http
      port: 5000
      targetPort: http
